limit_req_zone $binary_remote_addr zone=opssop_login:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 上传/表单上限；当前只接收文本，保留余量但不接受大文件
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 基础安全响应头；HSTS 由 TLS 终止层(宿主反向代理)按域名配置
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # 构建产物带内容哈希，可长期缓存；index.html 不缓存以便升级后立即生效
    location /assets/ {
        expires 1y;
    }

    # 前端静态资源与 SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # 登录入口的第一层限流；反向代理后的地址取决于可信代理配置。
    location = /api/auth/login {
        limit_req zone=opssop_login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # API 反向代理到后端容器；带实时工具的分析可能多轮调用，读超时放宽到 5 分钟
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
