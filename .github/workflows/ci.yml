name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opssop
          POSTGRES_PASSWORD: ci-only-db-password
          POSTGRES_DB: opssop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opssop -d opssop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_USER: opssop
      POSTGRES_PASSWORD: ci-only-db-password
      POSTGRES_DB: opssop
      POSTGRES_TEST_DB: opssop_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      SESSION_EXPIRE_HOURS: "8"
      OPSSOP_ENV: development
      OPSSOP_ADMIN_USERNAME: admin
      OPSSOP_ADMIN_PASSWORD: ci-only-admin-password
      OPSSOP_SEED_DEMO: "0"
      AI_MODE: disabled
      EMBEDDING_MODE: disabled
      LOCAL_ONLY: "0"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/preflight.py
      - run: python -m pytest tests -q

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-db-password
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      OPSSOP_ADMIN_PASSWORD: ci-only-admin-password
      OPSSOP_ENV: production
      OPSSOP_SEED_DEMO: "0"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
