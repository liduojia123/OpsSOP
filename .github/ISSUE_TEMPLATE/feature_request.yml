name: 功能建议
description: 描述业务场景和希望改善的流程
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前业务问题
      description: 谁在什么场景遇到什么困难？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述希望完成的操作及判断完成的标准。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前处理方式与其他信息
